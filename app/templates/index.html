<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataCheck CSV Analyzer</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <h1>CSV Quality Analyzer</h1>
    
    <form id="analyzeForm" enctype="multipart/form-data">
        <div class="form-group">
            <label for="name">Name (required)</label>
            <input type="text" id="name" name="name" required>
        </div>
        
        <div class="form-group">
            <label for="email">Email (required)</label>
            <input type="email" id="email" name="email" required>
        </div>
        
        <div class="form-group">
            <label for="service">Service (required)</label>
            <select id="service" name="service" required>
                <option value="">Select a service</option>
                <option value="Basic CSV Analysis">Basic CSV Analysis</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="description">Description (optional)</label>
            <textarea id="description" name="description" rows="3"></textarea>
        </div>
        
        <div class="form-group">
            <label for="csv_file">CSV File (required, max 5MB)</label>
            <input type="file" id="csv_file" name="csv_file" accept=".csv" required>
        </div>
        
        <button type="submit">Analyze CSV</button>
    </form>
    
    <div id="result" class="hidden">
        <h2>Analysis Result</h2>
        <pre id="resultContent"></pre>
    </div>
    
    <script src="/static/js/app.js"></script>
</body>
</html>
