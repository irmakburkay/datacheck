<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 — Something went wrong · DataCheck</title>
    <meta name="description" content="Something went wrong on the server.">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232563eb'/><path d='M9 10h9l5 5v7a2 2 0 01-2 2H9a2 2 0 01-2-2V12a2 2 0 012-2z' fill='white' opacity='.9'/><path d='M18 10v6h5' stroke='%232563eb' stroke-width='1.5' fill='none' stroke-linejoin='round'/><path d='M11 18h10M11 21h7' stroke='%232563eb' stroke-width='1.5' stroke-linecap='round'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/css/error.css">
</head>
<body class="error-page">

    <nav class="nav">
        <div class="container nav-inner">
            <a href="/" class="nav-logo">DataCheck</a>
        </div>
    </nav>

    <main class="error-main">
        <div class="error-inner">

            <!-- Illustration: a server on fire (but composed about it) -->
            <div class="error-illustration" aria-hidden="true">
                <svg viewBox="0 0 320 240" fill="none" xmlns="http://www.w3.org/2000/svg">

                    <!-- Server rack body -->
                    <rect x="95" y="90" width="130" height="100" rx="8" fill="white" stroke="#d1d5db" stroke-width="1.5"/>

                    <!-- Server units -->
                    <rect x="108" y="102" width="104" height="22" rx="4" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
                    <rect x="108" y="130" width="104" height="22" rx="4" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
                    <rect x="108" y="158" width="104" height="22" rx="4" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>

                    <!-- Status lights — first unit: one red -->
                    <circle cx="120" cy="113" r="3.5" fill="#16a34a"/>
                    <circle cx="132" cy="113" r="3.5" fill="#16a34a"/>
                    <circle cx="144" cy="113" r="3.5" fill="#dc2626"/>
                    <!-- drive slots -->
                    <rect x="160" y="108" width="40" height="10" rx="2" fill="#e5e7eb"/>

                    <!-- second unit: two red -->
                    <circle cx="120" cy="141" r="3.5" fill="#dc2626"/>
                    <circle cx="132" cy="141" r="3.5" fill="#dc2626"/>
                    <circle cx="144" cy="141" r="3.5" fill="#16a34a"/>
                    <rect x="160" y="136" width="40" height="10" rx="2" fill="#e5e7eb"/>

                    <!-- third unit: all grey (offline) -->
                    <circle cx="120" cy="169" r="3.5" fill="#d1d5db"/>
                    <circle cx="132" cy="169" r="3.5" fill="#d1d5db"/>
                    <circle cx="144" cy="169" r="3.5" fill="#d1d5db"/>
                    <rect x="160" y="164" width="40" height="10" rx="2" fill="#e5e7eb"/>

                    <!-- Flames on top of server -->
                    <path d="M148 90 C148 78 158 72 155 62 C162 70 168 76 164 90" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2" stroke-linejoin="round"/>
                    <path d="M155 90 C155 81 162 76 160 68 C166 75 170 80 168 90" fill="#fde68a" stroke="#f59e0b" stroke-width="1.2" stroke-linejoin="round"/>
                    <path d="M163 90 C163 83 168 79 167 73 C172 79 174 83 173 90" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2" stroke-linejoin="round"/>

                    <!-- Smoke wisps -->
                    <path d="M152 60 Q148 50 153 42" stroke="#d1d5db" stroke-width="1.5" stroke-linecap="round" fill="none"/>
                    <path d="M160 65 Q164 54 159 46" stroke="#d1d5db" stroke-width="1.5" stroke-linecap="round" fill="none"/>

                    <!-- Small wrench on the side -->
                    <g transform="translate(235, 130) rotate(30)">
                        <rect x="-3" y="-18" width="6" height="28" rx="3" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1"/>
                        <circle cx="0" cy="-18" r="6" fill="white" stroke="#d1d5db" stroke-width="1.2"/>
                        <circle cx="0" cy="-18" r="2.5" fill="#e5e7eb"/>
                    </g>

                    <!-- 500 text, faint -->
                    <text x="160" y="218" font-family="Inter, sans-serif" font-size="52" font-weight="800"
                          fill="#f3f4f6" text-anchor="middle" letter-spacing="-2">500</text>
                </svg>
            </div>

            <div class="error-code">500</div>
            <h1 class="error-title">Something went wrong on our end.</h1>
            <p class="error-desc">
                The server ran into an unexpected problem. This isn't your fault —
                the error has been logged and we'll look into it.
            </p>
            <div class="error-actions">
                <a href="/" class="btn btn-primary">Try again</a>
                <a href="mailto:irmaksabriburkay@gmail.com" class="btn btn-secondary">Report the issue</a>
            </div>
        </div>
    </main>

</body>
</html>
